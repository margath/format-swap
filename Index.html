<title>Format Swap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one working column. Drop zone on top, output settings beside it on wide screens, converted files listed below with per-file save. */
:root {
  --bg: #f1f4f5;
  --surface: #ffffff;
  --fg: #12201f;
  --muted: #566867;
  --line: #d3dcdc;
  --accent: #0a766f;
  --accent-fg: #ffffff;
  --accent-soft: #dff0ee;
  --danger: #b3261e;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1517; --surface: #162123; --fg: #e5eeed; --muted: #92a6a4;
    --line: #26393b; --accent: #43c4b9; --accent-fg: #04201d; --accent-soft: #17332f;
    --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1517; --surface: #162123; --fg: #e5eeed; --muted: #92a6a4;
  --line: #26393b; --accent: #43c4b9; --accent-fg: #04201d; --accent-soft: #17332f;
  --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.top { display: grid; gap: 16px; grid-template-columns: 1.15fr 1fr; align-items: stretch; }
@media (max-width: 720px) { .top { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.drop {
  display: grid; place-content: center; gap: 6px; text-align: center; min-height: 190px;
  border: 2px dashed var(--line); background: var(--surface); cursor: pointer;
}
.drop:hover, .drop.over, .drop:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.drop strong { font-family: var(--font-display); font-size: 1.15rem; }
.drop span { color: var(--muted); font-size: 0.9rem; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: block; }
.controls { display: grid; gap: 16px; align-content: start; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span {
  display: inline-block; padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px;
  font-weight: 500; background: var(--bg); cursor: pointer;
}
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input:disabled + span { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row output, .mono { font-family: var(--font-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1 1 140px; min-width: 0; accent-color: var(--accent); }
input[type="number"], input[type="color"] {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
}
input[type="number"] { width: 96px; padding: 6px 8px; }
input[type="color"] { width: 44px; height: 34px; padding: 2px; }
.hint { color: var(--muted); font-size: 0.82rem; margin: 0; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; }
button {
  font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent);
  border: 0; border-radius: 7px; padding: 8px 14px; cursor: pointer;
}
button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px; }
@media (max-width: 560px) { .item { grid-template-columns: 56px minmax(0, 1fr); } .item .acts { grid-column: 1 / -1; } }
.thumb {
  width: 72px; height: 72px; border-radius: 6px; border: 1px solid var(--line); overflow: hidden;
  background: repeating-conic-gradient(var(--line) 0% 25%, var(--surface) 0% 50%) 0 0 / 14px 14px;
}
@media (max-width: 560px) { .thumb { width: 56px; height: 56px; } }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.meta { min-width: 0; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.sub b { color: var(--fg); font-weight: 600; }
.err { color: var(--danger); }
.acts { display: flex; gap: 8px; }
.sample-tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 0.9rem;
  max-width: calc(100% - 32px); z-index: 20;
}
@media (prefers-reduced-motion: no-preference) { .drop, .seg span { transition: background 0.15s, border-color 0.15s; } }

<div class="wrap">
  <header>
    <h1>Format Swap</h1>
    <p class="lede">Convert images between PNG, WebP, JPEG, SVG and PDF. Everything runs in your browser, so your files are never uploaded.</p>
  </header>

  <div class="top">
    <label class="panel drop" id="drop" tabindex="0">
      <strong>Drop images here</strong>
      <span>or tap to choose files. PNG, JPEG, WebP, GIF, BMP, SVG and anything else your browser can open.</span>
      <input type="file" id="file" accept="image/*" multiple>
    </label>

    <div class="panel controls">
      <div>
        <span class="label" id="fmt-label">Convert to</span>
        <fieldset class="seg" aria-labelledby="fmt-label" id="fmt">
          <label><input type="radio" name="fmt" value="png" checked><span>PNG</span></label>
          <label><input type="radio" name="fmt" value="webp"><span>WebP</span></label>
          <label><input type="radio" name="fmt" value="jpeg"><span>JPEG</span></label>
          <label><input type="radio" name="fmt" value="svg"><span>SVG</span></label>
          <label><input type="radio" name="fmt" value="pdf"><span>PDF</span></label>
        </fieldset>
        <p class="hint" id="fmt-note"></p>
      </div>
      <div id="q-wrap">
        <label class="label" for="q">Quality</label>
        <div class="row"><input type="range" id="q" min="40" max="100" value="90"><output id="q-out" for="q">90</output></div>
      </div>
      <div id="bg-wrap">
        <label class="label" for="bg">Fill for transparent areas</label>
        <div class="row"><input type="color" id="bg" value="#ffffff"><span class="hint">Used by JPEG and PDF, which have no transparency.</span></div>
      </div>
      <div>
        <label class="label" for="mw">Max width (px, optional)</label>
        <div class="row"><input type="number" id="mw" min="16" max="16000" placeholder="Original"><span class="hint">Larger images are scaled down.</span></div>
      </div>
    </div>
  </div>

  <section id="results" hidden>
    <div class="bar">
      <h2 id="count">Converted files</h2>
      <div class="acts">
        <button class="ghost" id="clear" type="button">Clear</button>
        <button id="zip" type="button">Save all as ZIP</button>
      </div>
    </div>
    <ul id="items"></ul>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const FORMATS = {
  png:  { mime: 'image/png',     ext: 'png',  label: 'PNG' },
  webp: { mime: 'image/webp',    ext: 'webp', label: 'WebP' },
  jpeg: { mime: 'image/jpeg',    ext: 'jpg',  label: 'JPEG' },
  svg:  { mime: 'image/svg+xml', ext: 'svg',  label: 'SVG' },
  pdf:  { mime: 'application/pdf', ext: 'pdf', label: 'PDF' }
};
const NOTES = {
  png: 'Lossless, keeps transparency.',
  webp: 'Small files, keeps transparency.',
  jpeg: 'Small photos, no transparency.',
  svg: 'A vector wrapper that embeds the image as PNG. It does not trace shapes.',
  pdf: 'One page per image, sized to the image.'
};
let items = [];
let nextId = 1;
let downloads = null;
let timer = 0;
let toastTimer = 0;

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}
function baseName(name) {
  const i = name.lastIndexOf('.');
  return (i > 0 ? name.slice(0, i) : name) || 'image';
}
function canvasBlob(canvas, mime, q) {
  return new Promise((res) => canvas.toBlob(res, mime, q));
}
async function bytes(blob) { return new Uint8Array(await blob.arrayBuffer()); }
function toBase64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

function drawCanvas(item, opts, flatten) {
  let w = item.w, h = item.h;
  if (opts.maxW && w > opts.maxW) { h = Math.max(1, Math.round(h * opts.maxW / w)); w = opts.maxW; }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (flatten) { g.fillStyle = opts.bg; g.fillRect(0, 0, w, h); }
  g.imageSmoothingQuality = 'high';
  g.drawImage(item.img, 0, 0, w, h);
  return c;
}

function buildPdf(jpg, w, h) {
  const enc = new TextEncoder();
  const parts = [], offs = [];
  let pos = 0;
  const push = (d) => { const u = typeof d === 'string' ? enc.encode(d) : d; parts.push(u); pos += u.length; };
  const pw = (w * 0.75).toFixed(2), ph = (h * 0.75).toFixed(2);
  const obj = (n, body) => { offs[n] = pos; push(n + ' 0 obj\n' + body + '\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
  obj(4, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
  offs[5] = pos;
  push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h +
    ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
  push(jpg);
  push('\nendstream\nendobj\n');
  const xref = pos;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let n = 1; n <= 5; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}

async function encode(item, fmt, opts) {
  const q = opts.q / 100;
  if (fmt === 'png' || fmt === 'webp') {
    const b = await canvasBlob(drawCanvas(item, opts, false), FORMATS[fmt].mime, q);
    if (!b || b.type !== FORMATS[fmt].mime) throw new Error(FORMATS[fmt].label + ' export is not supported in this browser.');
    return { blob: b, w: item.w, h: item.h };
  }
  if (fmt === 'jpeg' || fmt === 'pdf') {
    const c = drawCanvas(item, opts, true);
    const b = await canvasBlob(c, 'image/jpeg', q);
    if (!b) throw new Error('Could not encode this image.');
    if (fmt === 'jpeg') return { blob: b, w: c.width, h: c.height };
    return { blob: buildPdf(await bytes(b), c.width, c.height), w: c.width, h: c.height };
  }
  const c = drawCanvas(item, opts, false);
  const b = await canvasBlob(c, 'image/png');
  if (!b) throw new Error('Could not encode this image.');
  const b64 = toBase64(await bytes(b));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' + c.width +
    '" height="' + c.height + '" viewBox="0 0 ' + c.width + ' ' + c.height + '"><image width="' + c.width +
    '" height="' + c.height + '" xlink:href="data:image/png;base64,' + b64 + '"/></svg>';
  return { blob: new Blob([svg], { type: 'image/svg+xml' }), w: c.width, h: c.height };
}

const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function buildZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let off = 0;
  const now = new Date();
  const dt = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const tm = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  for (const f of files) {
    const data = await bytes(f.blob), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + data.length;
  }
  let csize = 0;
  central.forEach((c) => { csize += c.length; });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

function settings() {
  return {
    fmt: document.querySelector('input[name="fmt"]:checked').value,
    q: +$('q').value,
    bg: $('bg').value,
    maxW: parseInt($('mw').value, 10) || 0
  };
}
function syncControls() {
  const s = settings();
  $('q-wrap').hidden = !(s.fmt === 'webp' || s.fmt === 'jpeg' || s.fmt === 'pdf');
  $('bg-wrap').hidden = !(s.fmt === 'jpeg' || s.fmt === 'pdf');
  $('fmt-note').textContent = NOTES[s.fmt];
  $('q-out').textContent = s.q;
}
function srcLabel(f) {
  if (f.type) return f.type.split('/')[1].replace('svg+xml', 'svg').replace('x-icon', 'ico').replace('vnd.microsoft.icon', 'ico').toUpperCase();
  const m = /\.([a-z0-9]+)$/i.exec(f.name);
  return m ? m[1].toUpperCase() : 'Image';
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This browser could not open that file as an image.')); };
    img.src = url;
  });
}

async function convertItem(item) {
  const gen = (item.gen = (item.gen || 0) + 1);
  item.status = 'working';
  render();
  const s = settings();
  try {
    const r = await encode(item, s.fmt, s);
    if (gen !== item.gen) return;
    item.out = { blob: r.blob, w: r.w, h: r.h, fmt: s.fmt };
    item.status = 'done';
  } catch (e) {
    if (gen !== item.gen) return;
    item.status = 'error';
    item.error = e.message || 'Conversion failed.';
  }
  render();
}
function convertAll() { items.forEach(convertItem); }
function convertSoon() { clearTimeout(timer); timer = setTimeout(convertAll, 250); }

async function saveBlob(filename, data) {
  if (!downloads) { toast('Saving is not available in this view.'); return; }
  try {
    await downloads.save({ filename, data });
    toast('Saved ' + filename);
  } catch (e) {
    const code = e && e.code;
    if (code === 'declined') return;
    if (code === 'rate_limited') toast('Another save prompt is open. Try again in a moment.');
    else if (code === 'too_large') toast('That file is too large to save here. Try a smaller max width.');
    else toast('Could not save ' + filename + '.');
  }
}
function outName(item) { return baseName(item.name) + '.' + FORMATS[item.out.fmt].ext; }
function saveItem(item) { if (item.status === 'done') saveBlob(outName(item), item.out.blob); }
async function saveZip() {
  const done = items.filter((i) => i.status === 'done');
  if (!done.length) return;
  const used = new Map();
  const files = done.map((i) => {
    let n = outName(i);
    const k = n.toLowerCase();
    const c = used.get(k) || 0;
    used.set(k, c + 1);
    if (c) n = n.replace(/(\.[^.]+)$/, ' (' + (c + 1) + ')$1');
    return { name: n, blob: i.out.blob };
  });
  try { saveBlob('converted-images.zip', await buildZip(files)); }
  catch (e) { toast('Could not build the ZIP file.'); }
}

function render() {
  $('results').hidden = !items.length;
  const done = items.filter((i) => i.status === 'done');
  $('count').textContent = items.length === 1 ? '1 image' : items.length + ' images';
  $('zip').hidden = items.length < 2;
  $('zip').disabled = !done.length || !downloads;
  const ul = $('items');
  ul.textContent = '';
  for (const it of items) {
    const li = document.createElement('li');
    li.className = 'panel item';
    const th = document.createElement('div');
    th.className = 'thumb';
    const im = document.createElement('img');
    im.src = it.url; im.alt = '';
    th.append(im);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = it.name;
    if (it.sample) {
      const tg = document.createElement('span');
      tg.className = 'sample-tag';
      tg.textContent = '  Sample';
      nm.append(tg);
    }
    const sub = document.createElement('div');
    sub.className = 'sub';
    if (it.status === 'working') sub.textContent = 'Converting…';
    else if (it.status === 'error') { sub.className = 'sub err'; sub.textContent = it.error; }
    else {
      const o = it.out;
      sub.textContent = it.srcType + ' ' + fmtSize(it.srcSize) + '  →  ' + FORMATS[o.fmt].label + ' ' +
        fmtSize(o.blob.size) + '  ·  ' + o.w + '×' + o.h + ' px';
    }
    meta.append(nm, sub);
    const acts = document.createElement('div');
    acts.className = 'acts';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Save ' + (it.status === 'done' ? FORMATS[it.out.fmt].label : '');
    b.disabled = it.status !== 'done' || !downloads;
    b.addEventListener('click', () => saveItem(it));
    acts.append(b);
    li.append(th, meta, acts);
    ul.append(li);
  }
}

async function addFiles(files, sample) {
  for (const f of files) {
    if (!/^image\//.test(f.type) && !/\.(png|jpe?g|webp|gif|bmp|svg|avif|ico|tiff?)$/i.test(f.name)) {
      toast(f.name + ' is not an image.');
      continue;
    }
    const it = { id: nextId++, name: f.name, srcType: srcLabel(f), srcSize: f.size, sample: !!sample, status: 'working' };
    try {
      const loaded = await loadImage(f);
      it.img = loaded.img; it.url = loaded.url;
      it.w = loaded.img.naturalWidth || 800;
      it.h = loaded.img.naturalHeight || 800;
    } catch (e) { toast(f.name + ': ' + e.message); continue; }
    items.push(it);
    convertItem(it);
  }
}

async function makeSample() {
  const c = document.createElement('canvas');
  c.width = 960; c.height = 640;
  const g = c.getContext('2d');
  g.beginPath();
  if (g.roundRect) g.roundRect(0, 0, 960, 640, 56); else g.rect(0, 0, 960, 640);
  g.clip();
  const sky = g.createLinearGradient(0, 0, 0, 640);
  sky.addColorStop(0, '#274c77'); sky.addColorStop(0.62, '#f2a65a'); sky.addColorStop(1, '#f7d6a0');
  g.fillStyle = sky; g.fillRect(0, 0, 960, 640);
  g.fillStyle = '#fff3cf'; g.beginPath(); g.arc(690, 340, 92, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#2f6b66';
  g.beginPath(); g.moveTo(0, 470); g.quadraticCurveTo(220, 330, 460, 450); g.quadraticCurveTo(700, 560, 960, 410); g.lineTo(960, 640); g.lineTo(0, 640); g.fill();
  g.fillStyle = '#1b4642';
  g.beginPath(); g.moveTo(0, 540); g.quadraticCurveTo(300, 450, 560, 540); g.quadraticCurveTo(780, 610, 960, 520); g.lineTo(960, 640); g.lineTo(0, 640); g.fill();
  const blob = await canvasBlob(c, 'image/png');
  return new File([blob], 'sample-landscape.png', { type: 'image/png' });
}

$('fmt').addEventListener('change', () => { syncControls(); convertAll(); });
$('q').addEventListener('input', () => { syncControls(); convertSoon(); });
$('bg').addEventListener('input', convertSoon);
$('mw').addEventListener('input', convertSoon);
$('zip').addEventListener('click', saveZip);
$('clear').addEventListener('click', () => {
  items.forEach((i) => { i.gen = -1; if (i.url) URL.revokeObjectURL(i.url); });
  items = [];
  render();
});
$('file').addEventListener('change', (e) => {
  const list = Array.from(e.target.files);
  e.target.value = '';
  addFiles(list, false);
});
const drop = $('drop');
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('over');
  addFiles(Array.from(e.dataTransfer.files), false);
});

async function init() {
  syncControls();
  try {
    const t = document.createElement('canvas');
    t.width = t.height = 2;
    const wb = await canvasBlob(t, 'image/webp', 0.8);
    if (!wb || wb.type !== 'image/webp') {
      const r = document.querySelector('input[name="fmt"][value="webp"]');
      r.disabled = true;
      r.parentElement.title = 'This browser cannot export WebP.';
    }
  } catch (e) { /* leave WebP enabled; the encoder reports its own error */ }
  addFiles([await makeSample()], true);
  try {
    if (window.claude && window.claude.use) downloads = await window.claude.use('downloads');
  } catch (e) { downloads = null; }
  if (!downloads) toast('Saving files is not available in this view.');
  render();
}
init();
</script>
